name: Generate Snake

on:
  # Executa automaticamente a cada 24 horas (à meia-noite)
  schedule:
    - cron: "0 0 * * *"
  
  # Permite rodar o script manualmente na aba "Actions" quando quiseres
  workflow_dispatch:
  
  # Executa sempre que fizeres um push na branch main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Gera os ficheiros da cobrinha (versão light e dark) na branch 'output'
      - name: generate-github-user-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Envia os ficheiros gerados para a branch 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
